name: Sync domain prices

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

# Allow the job to commit the refreshed price snapshot back to the repo,
# which triggers a Vercel redeploy with up-to-date prices.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DYNADOT_API_KEY: ${{ secrets.DYNADOT_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Commit refreshed snapshot if changed
        run: |
          if ! git diff --quiet -- data/prices.json; then
            git config user.name "namescout-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "chore: refresh domain prices [skip ci]"
            git push
          else
            echo "No price changes."
          fi
